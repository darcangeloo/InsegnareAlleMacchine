  <circle cx="195" cy="175" r="6" fill="#E60000" fill-opacity="0.32" stroke="#E60000" stroke-width="1" stroke-dasharray="2 2"/>
  <circle cx="140" cy="195" r="6" fill="#E60000" fill-opacity="0.32" stroke="#E60000" stroke-width="1" stroke-dasharray="2 2"/>
  <circle cx="185" cy="100" r="6" fill="#E60000" fill-opacity="0.32" stroke="#E60000" stroke-width="1" stroke-dasharray="2 2"/>

